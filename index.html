<!DOCTYPE html>
<html lang="id">
<head>
    <title>Wellen Print - Logistics Command Center</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS: Bootstrap 5 & Leaflet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root { --primary-color: #d32f2f; --secondary-color: #2c3e50; }
        body { background-color: #f8f9fa; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Header */
        .navbar { background: white; border-bottom: 1px solid #dee2e6; z-index: 1050; }
        .logo-img { height: 40px; }

        /* Main Layout */
        .main-container { flex: 1; display: flex; overflow: hidden; }

        /* Sidebar Left: Courier Status */
        .sidebar-left { width: 300px; background: white; border-right: 1px solid #dee2e6; overflow-y: auto; }
        .courier-card { border: none; border-bottom: 1px solid #f1f1f1; border-radius: 0; transition: 0.2s; cursor: pointer; }
        .courier-card:hover { background-color: #f8f9fa; }
        .courier-card.active { border-left: 4px solid var(--primary-color); background-color: #fff5f5; }

        /* Center: Map */
        #map { flex: 1; background: #e5e3df; }

        /* Sidebar Right: Dispatch & Active Trips */
        .sidebar-right { width: 380px; background: white; border-left: 1px solid #dee2e6; display: flex; flex-direction: column; }
        .nav-tabs .nav-link { font-weight: 600; color: #666; border: none; border-bottom: 3px solid transparent; }
        .nav-tabs .nav-link.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { flex: 1; overflow-y: auto; padding: 15px; }

        /* Components */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-online { background-color: #2ecc71; }
        .bg-offline { background-color: #95a5a6; }

        .trip-progress-card { border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; padding: 12px; position: relative; }
        .progress { height: 6px; margin: 10px 0; }

        .destination-pill { font-size: 0.8rem; background: #f1f3f5; padding: 4px 10px; border-radius: 15px; display: block; margin-top: 5px; border: 1px solid #e9ecef; }
        .destination-pill.done { background: #d4edda; color: #155724; }
        .destination-pill.arrived { background: #fff3cd; color: #856404; }

        .search-item { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.85rem; }
        .search-item:hover { background: #f8f9fa; color: var(--primary-color); }

        .stats-box { background: var(--secondary-color); color: white; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="wellen_logo.jpg" alt="Logo" class="logo-img me-2">
                <span class="fw-bold text-dark">COMMAND CENTER</span>
            </a>
            <div class="ms-auto d-flex align-items-center text-muted small">
                <i class="bi bi-clock me-1"></i> <span id="current-time"></span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- LEFT: COURIER LIST -->
        <div class="sidebar-left">
            <div class="p-3 bg-light border-bottom">
                <h6 class="mb-0 fw-bold">KURIR ONLINE (<span id="count-online">0</span>)</h6>
            </div>
            <div id="courier-list-container">
                <!-- Dynamic Content -->
            </div>
        </div>

        <!-- CENTER: MAP -->
        <div id="map"></div>

        <!-- RIGHT: DISPATCH & MANAGEMENT -->
        <div class="sidebar-right">
            <ul class="nav nav-tabs nav-fill" id="adminTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-dispatch">DISPATCH</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-active">MONITOR</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-history">LAPORAN</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- TAB 1: DISPATCH -->
                <div class="tab-pane fade show active" id="tab-dispatch">
                    <div class="mb-3">
                        <label class="form-label fw-bold">1. Pilih Kurir</label>
                        <select id="dispatch-courier-select" class="form-select shadow-sm">
                            <option value="">-- Pilih Kurir --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">2. Tambah Tujuan (5-7 Lokasi)</label>
                        <div class="input-group mb-2">
                            <input type="text" id="loc-search" class="form-control" placeholder="Cari Nama PT / Alamat...">
                            <button class="btn btn-primary" onclick="searchLocation()"><i class="bi bi-search"></i></button>
                        </div>
                        <div id="search-results-list" class="border rounded bg-light mb-2" style="max-height: 150px; overflow-y: auto; display:none;"></div>

                        <div id="trip-queue" class="mt-3">
                            <!-- Queued Points -->
                        </div>
                    </div>

                    <button class="btn btn-danger w-100 fw-bold py-2 mt-2" onclick="submitTrip()">
                        <i class="bi bi-send-fill me-1"></i> KIRIM TUGAS SEKARANG
                    </button>
                </div>

                <!-- TAB 2: ACTIVE MONITOR -->
                <div class="tab-pane fade" id="tab-active">
                    <div id="active-trips-container">
                        <!-- Dynamic Content -->
                    </div>
                </div>

                <!-- TAB 3: HISTORY / REPORTS -->
                <div class="tab-pane fade" id="tab-history">
                    <div class="stats-box mb-3 text-center">
                        <div class="small">TOTAL JARAK HARI INI</div>
                        <div class="h4 mb-0 fw-bold"><span id="stats-total-km">0.00</span> KM</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase">Pilih Tanggal Laporan</label>
                        <input type="date" id="report-date" class="form-control form-control-sm" onchange="loadReport()">
                    </div>
                    <div id="report-results-container">
                        <!-- History Data -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase & Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDoviDNLl_aSjM1NMN-g_gHpeIPPzC6Rk",
            authDomain: "ontrack-fccb8.firebaseapp.com",
            databaseURL: "https://ontrack-fccb8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ontrack-fccb8",
            storageBucket: "ontrack-fccb8.firebasestorage.app",
            messagingSenderId: "180144218738",
            appId: "1:180144218738:android:b0b991a7575ae7693ed8eb"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const db = firebase.firestore();

        // Map Setup
        const map = L.map('map').setView([-6.200000, 106.816666], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);

        const markers = {};
        let tripQueue = [];

        // Update Clock
        setInterval(() => {
            document.getElementById('current-time').innerText = new Date().toLocaleString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }, 1000);

        // --- DISPATCH LOGIC ---
        async function searchLocation() {
            const query = document.getElementById('loc-search').value;
            if (query.length < 3) return;
            const el = document.getElementById('search-results-list');
            el.innerHTML = '<div class="p-2 small">Mencari...</div>';
            el.style.display = 'block';

            const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=id&limit=5`);
            const data = await resp.json();
            el.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerText = item.display_name;
                div.onclick = () => addToQueue(item);
                el.appendChild(div);
            });
        }

        function addToQueue(item) {
            tripQueue.push({ name: item.display_name.split(',')[0], lat: parseFloat(item.lat), lng: parseFloat(item.lon) });
            renderQueue();
            document.getElementById('search-results-list').style.display = 'none';
            document.getElementById('loc-search').value = '';
        }

        function renderQueue() {
            const container = document.getElementById('trip-queue');
            container.innerHTML = '<b>Rute Saat Ini:</b>';
            tripQueue.forEach((d, i) => {
                const div = document.createElement('div');
                div.className = 'destination-pill d-flex justify-content-between align-items-center';
                div.innerHTML = `<span>${i+1}. ${d.name}</span> <i class="bi bi-x-circle text-danger cursor-pointer" onclick="tripQueue.splice(${i},1); renderQueue();"></i>`;
                container.appendChild(div);
            });
        }

        async function submitTrip() {
            const cid = document.getElementById('dispatch-courier-select').value;
            if (!cid || tripQueue.length === 0) return alert("Pilih Kurir dan masukkan rute!");

            const tripId = "TRIP_" + Date.now();
            await db.collection('trips').doc(tripId).set({
                tripId, courierId: cid, status: "assigned", date: firebase.firestore.Timestamp.now(),
                destinations: tripQueue.map((d, i) => ({ stopIndex: i+1, locationName: d.name, latitude: d.lat, longitude: d.lng, status: "pending" }))
            });
            alert("Tugas berhasil dikirim ke kurir!");
            tripQueue = []; renderQueue();
        }

        // --- REALTIME LISTENERS ---

        // 1. Online Couriers (RTDB)
        rtdb.ref('courier_live_location').on('value', (snap) => {
            const data = snap.val() || {};
            const container = document.getElementById('courier-list-container');
            const select = document.getElementById('dispatch-courier-select');
            const countOnline = document.getElementById('count-online');

            container.innerHTML = '';
            select.innerHTML = '<option value="">-- Pilih Kurir --</option>';
            let count = 0;
            let totalKm = 0;

            for (const id in data) {
                const c = data[id];
                count++;
                totalKm += c.totalDistanceKm;

                // Update Marker on Map
                if (markers[id]) {
                    markers[id].setLatLng([c.lat, c.lng]);
                } else {
                    markers[id] = L.marker([c.lat, c.lng]).addTo(map).bindPopup(`Kurir: ${id.substring(0,8)}`);
                }

                // Sidebar Card
                const card = document.createElement('div');
                card.className = 'courier-card p-3';
                card.onclick = () => map.flyTo([c.lat, c.lng], 16);
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="status-dot bg-online"></span>
                            <span class="fw-bold">${id.substring(0,8)}...</span>
                        </div>
                        <span class="badge bg-light text-dark border">${c.batteryLevel}% <i class="bi bi-battery-full"></i></span>
                    </div>
                    <div class="small text-muted mt-1">
                        <i class="bi bi-speedometer2"></i> ${c.totalDistanceKm.toFixed(2)} KM Tempuh
                    </div>
                `;
                container.appendChild(card);

                // Populate Dropdown
                const opt = document.createElement('option');
                opt.value = id; opt.innerText = `Kurir ${id.substring(0,8)}...`;
                select.appendChild(opt);
            }
            countOnline.innerText = count;
            document.getElementById('stats-total-km').innerText = totalKm.toFixed(2);
        });

        // 2. Active Trips Monitor (Firestore)
        db.collection('trips').where('status', '!=', 'completed').onSnapshot(snap => {
            const container = document.getElementById('active-trips-container');
            container.innerHTML = '';
            snap.forEach(doc => {
                const trip = doc.data();
                const total = trip.destinations.length;
                const done = trip.destinations.filter(d => d.status === 'done').length;
                const percent = (done / total) * 100;

                const card = document.createElement('div');
                card.className = 'trip-progress-card shadow-sm bg-white';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <strong class="text-uppercase small">Trip: ${doc.id.substring(0,8)}</strong>
                        <span class="status-badge status-${trip.status}">${trip.status}</span>
                    </div>
                    <div class="small text-muted mb-2">Kurir: ${trip.courierId.substring(0,8)}...</div>
                    <div class="progress"><div class="progress-bar bg-success" style="width: ${percent}%"></div></div>
                    <div class="small text-end fw-bold mb-2">${done}/${total} Selesai</div>
                    <div>
                        ${trip.destinations.map(d => `
                            <div class="destination-pill ${d.status}">
                                <i class="bi ${d.status === 'done' ? 'bi-check-circle-fill' : 'bi-geo-alt'}"></i> ${d.locationName}
                                ${d.arrivalTime ? `<br><small class="ms-3 text-muted">Jam: ${new Date(d.arrivalTime.seconds*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        });

        // --- REPORT LOGIC ---
        async function loadReport() {
            const dateStr = document.getElementById('report-date').value;
            if (!dateStr) return;
            const container = document.getElementById('report-results-container');
            container.innerHTML = '<div class="text-center p-3 small text-muted">Memuat Riwayat...</div>';

            const start = new Date(dateStr); start.setHours(0,0,0,0);
            const end = new Date(dateStr); end.setHours(23,59,59,999);

            const snap = await db.collection('trips')
                .where('date', '>=', firebase.firestore.Timestamp.fromDate(start))
                .where('date', '<=', firebase.firestore.Timestamp.fromDate(end))
                .get();

            if (snap.empty) { container.innerHTML = '<div class="alert alert-warning p-2 small">Tidak ada data.</div>'; return; }

            container.innerHTML = '';
            snap.forEach(doc => {
                const t = doc.data();
                const first = t.destinations[0]?.arrivalTime;
                const last = t.destinations[t.destinations.length-1]?.completedTime;
                let durText = "N/A";
                if (first && last) durText = Math.round((last.seconds - first.seconds)/60) + " min";

                const div = document.createElement('div');
                div.className = 'card mb-2 p-2 border-0 shadow-sm bg-white';
                div.style.fontSize = '0.85rem';
                div.innerHTML = `
                    <div class="fw-bold border-bottom pb-1 mb-1">TRIP: ${doc.id.substring(0,8)}</div>
                    <div>Kurir: <small>${t.courierId.substring(0,8)}...</small></div>
                    <div>Tujuan: ${t.destinations.length} titik</div>
                    <div>Durasi: <span class="badge bg-secondary">${durText}</span></div>
                    <div class="mt-2 text-primary fw-bold" style="cursor:pointer" onclick="this.nextElementSibling.classList.toggle('d-none')">Lihat Detail <i class="bi bi-chevron-down"></i></div>
                    <div class="d-none mt-1">
                        ${t.destinations.map(d => `
                            <div class="border-top py-1 small">
                                ${d.locationName}<br>
                                <span class="text-muted small">Arr: ${d.arrivalTime ? new Date(d.arrivalTime.seconds*1000).toLocaleTimeString() : '-'}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
