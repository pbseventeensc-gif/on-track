<!DOCTYPE html>
<html lang="id">
<head>
    <title>Admin Panel - Wellen Print Tracking</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; display: flex; height: 100vh; background: #f4f7f6; }
        #sidebar { width: 420px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        #map { flex: 1; }
        .p-3 { padding: 20px; }
        .card { background: white; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        h3, h4 { margin: 0 0 15px 0; color: #2c3e50; }

        .status-badge { padding: 3px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 0.75em; text-transform: uppercase; }
        .status-in_progress { background: #f39c12; }
        .status-completed { background: #27ae60; }
        .status-assigned { background: #7f8c8d; }

        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #dfe6e9; border-radius: 6px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; transition: 0.2s; }
        button:hover { background: #2980b9; }
        button.success { background: #2ecc71; }
        button.danger { background: #e74c3c; width: auto; padding: 5px 10px; font-size: 0.8em; }

        .dest-detail { font-size: 0.85em; border-left: 3px solid #3498db; padding-left: 10px; margin-top: 10px; color: #636e72; }
        .search-result { padding: 10px; border-bottom: 1px solid #f1f2f6; cursor: pointer; font-size: 0.85em; }
        .search-result:hover { background: #f1f2f6; }

        .tab-btn { padding: 10px; border: none; background: #eee; cursor: pointer; flex: 1; font-weight: bold; }
        .tab-btn.active { background: white; border-bottom: 3px solid #3498db; }

        .report-summary { background: #e8f4fd; border-radius: 8px; padding: 12px; margin-top: 10px; font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div style="display: flex;">
            <button class="tab-btn active" onclick="showTab('dispatch')">Dispatch</button>
            <button class="tab-btn" onclick="showTab('reports')">Laporan</button>
        </div>

        <!-- TAB DISPATCH -->
        <div id="tab-dispatch" class="p-3">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="wellen_logo.jpg" alt="Wellen Logo" style="width: 150px;">
                <h3 style="margin-top: 10px;">Admin Panel</h3>
            </div>
            <div class="card">
                <h4>1. Pilih Kurir</h4>
                <input type="text" id="courier-id-input" placeholder="Masukkan UID Kurir">
            </div>

            <div class="card">
                <h4>2. Atur Rute</h4>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="search-input" placeholder="Cari Nama PT / Alamat...">
                    <button style="width: 80px;" onclick="searchLocation()">Cari</button>
                </div>
                <div id="search-results" style="max-height: 120px; overflow-y: auto;"></div>
                <div id="queued-destinations" style="margin-top: 10px;"></div>
                <button class="success" style="margin-top: 15px;" onclick="dispatchTrip()">KIRIM TUGAS SEKARANG</button>
            </div>

            <h4>Tugas Sedang Jalan</h4>
            <div id="trips-list"></div>
        </div>

        <!-- TAB LAPORAN -->
        <div id="tab-reports" class="p-3" style="display:none;">
            <h3>Laporan Perjalanan</h3>
            <input type="date" id="report-date" onchange="loadReports()">

            <div id="reports-content" style="margin-top: 15px;">
                <p>Pilih tanggal untuk melihat data.</p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDoviDNLl_aSjM1NMN-g_gHpeIPPzC6Rk",
            authDomain: "ontrack-fccb8.firebaseapp.com",
            databaseURL: "https://ontrack-fccb8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ontrack-fccb8",
            storageBucket: "ontrack-fccb8.firebasestorage.app",
            messagingSenderId: "180144218738",
            appId: "1:180144218738:android:b0b991a7575ae7693ed8eb"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const db = firebase.firestore();

        const map = L.map('map').setView([-6.200000, 106.816666], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const markers = {};
        let queuedDestinations = [];

        function showTab(name) {
            document.getElementById('tab-dispatch').style.display = name === 'dispatch' ? 'block' : 'none';
            document.getElementById('tab-reports').style.display = name === 'reports' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- DISPATCH LOGIC ---
        async function searchLocation() {
            const query = document.getElementById('search-input').value;
            if (query.length < 3) return;
            const resEl = document.getElementById('search-results');
            resEl.innerHTML = 'Mencari...';
            const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=id&limit=5`);
            const data = await resp.json();
            resEl.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-result';
                div.innerText = item.display_name;
                div.onclick = () => {
                    queuedDestinations.push({ name: item.display_name.split(',')[0], lat: parseFloat(item.lat), lng: parseFloat(item.lon) });
                    renderQueued();
                    resEl.innerHTML = ''; document.getElementById('search-input').value = '';
                };
                resEl.appendChild(div);
            });
        }

        function renderQueued() {
            const container = document.getElementById('queued-destinations');
            container.innerHTML = '';
            queuedDestinations.forEach((d, i) => {
                const div = document.createElement('div');
                div.style = "display:flex; justify-content:space-between; padding:5px; background:#f9f9f9; margin-top:2px;";
                div.innerHTML = `<span>${i+1}. ${d.name}</span> <button class="danger" onclick="queuedDestinations.splice(${i},1); renderQueued();">X</button>`;
                container.appendChild(div);
            });
        }

        async function dispatchTrip() {
            const cid = document.getElementById('courier-id-input').value;
            if (!cid || queuedDestinations.length === 0) return alert("UID Kurir & Rute harus diisi!");
            const tripId = "TRIP_" + Date.now();
            await db.collection('trips').doc(tripId).set({
                tripId, courierId: cid, status: "assigned", date: firebase.firestore.Timestamp.now(), totalDistanceKm: 0,
                destinations: queuedDestinations.map((d, i) => ({ stopIndex: i+1, locationName: d.name, latitude: d.lat, longitude: d.lng, status: "pending" }))
            });
            alert("Tugas Terkirim!"); queuedDestinations = []; renderQueued();
        }

        // --- REALTIME LISTENERS ---
        rtdb.ref('courier_live_location').on('value', (snap) => {
            const data = snap.val();
            for (const id in data) {
                const c = data[id];
                if (markers[id]) markers[id].setLatLng([c.lat, c.lng]);
                else markers[id] = L.marker([c.lat, c.lng]).addTo(map).bindPopup(`Kurir: ${id}`);
            }
        });

        db.collection('trips').where('status', '!=', 'completed').onSnapshot(snap => {
            const listEl = document.getElementById('trips-list');
            listEl.innerHTML = '';
            snap.forEach(doc => {
                const trip = doc.data();
                const div = document.createElement('div');
                div.className = 'card';
                let destHtml = trip.destinations.map(d => `
                    <div class="dest-detail">
                        <b>${d.locationName}</b> [${d.status}]<br>
                        <small>Arrived: ${d.arrivalTime ? new Date(d.arrivalTime.seconds*1000).toLocaleTimeString() : '-'}</small><br>
                        <small>Done: ${d.completedTime ? new Date(d.completedTime.seconds*1000).toLocaleTimeString() : '-'}</small>
                    </div>
                `).join('');
                div.innerHTML = `<b>ID: ${doc.id.substring(0,8)}</b> <span class="status-badge status-${trip.status}">${trip.status}</span><br>${destHtml}`;
                listEl.appendChild(div);
            });
        });

        // --- REPORTING LOGIC ---
        async function loadReports() {
            const dateStr = document.getElementById('report-date').value;
            if (!dateStr) return;

            const start = new Date(dateStr); start.setHours(0,0,0,0);
            const end = new Date(dateStr); end.setHours(23,59,59,999);

            const contentEl = document.getElementById('reports-content');
            contentEl.innerHTML = 'Memuat data...';

            const snap = await db.collection('trips')
                .where('date', '>=', firebase.firestore.Timestamp.fromDate(start))
                .where('date', '<=', firebase.firestore.Timestamp.fromDate(end))
                .get();

            if (snap.empty) { contentEl.innerHTML = 'Tidak ada riwayat untuk tanggal ini.'; return; }

            let totalKm = 0;
            let totalStops = 0;
            let reportHtml = '';

            snap.forEach(doc => {
                const trip = doc.data();
                totalStops += trip.destinations.length;

                let tripDuration = "-";
                const first = trip.destinations[0].arrivalTime;
                const last = trip.destinations[trip.destinations.length-1].completedTime;
                if (first && last) {
                    const diff = (last.seconds - first.seconds) / 60; // minutes
                    tripDuration = Math.round(diff) + " menit";
                }

                reportHtml += `
                    <div class="card">
                        <b>Trip: ${doc.id.substring(0,8)}</b><br>
                        Kurir UID: <small>${trip.courierId}</small><br>
                        Total Tujuan: ${trip.destinations.length}<br>
                        Durasi Total: ${tripDuration}
                        <hr>
                        ${trip.destinations.map(d => {
                            let dur = "-";
                            if (d.arrivalTime && d.completedTime) dur = Math.round((d.completedTime.seconds - d.arrivalTime.seconds)/60) + "m";
                            return `<div style="font-size:0.8em">📍 ${d.locationName} (${dur})</div>`;
                        }).join('')}
                    </div>
                `;
            });

            // Ambil live distance terakhir dari RTDB untuk estimasi hari ini
            const liveSnap = await rtdb.ref('courier_live_location').get();
            let distanceHtml = "Jarak tempuh hari ini akan terakumulasi di sini.";
            if (liveSnap.exists()) {
                let distSum = 0;
                Object.values(liveSnap.val()).forEach(c => distSum += c.totalDistanceKm);
                totalKm = distSum;
            }

            contentEl.innerHTML = `
                <div class="report-summary">
                    KM Hari Ini: ${totalKm.toFixed(2)} km<br>
                    Total Tujuan: ${totalStops} lokasi
                </div>
                ${reportHtml}
            `;
        }
    </script>
</body>
</html>
