<!DOCTYPE html>
<html lang="id">
<head>
    <title>Wellen Print - Admin Command Center</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary-red: #d32f2f; --wellen-yellow: #f1c40f; --sidebar-bg: #1a1c23; }
        body { background-color: #f4f7f6; height: 100vh; overflow: hidden; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Sidebar Professional Panel */
        .sidebar { width: 350px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; z-index: 1100; box-shadow: 4px 0 15px rgba(0,0,0,0.3); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #2d2f39; text-align: center; background: white; }
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 15px; }

        /* Main Workspace */
        .main-workspace { flex: 1; display: flex; flex-direction: column; position: relative; }
        #map { height: 60vh; width: 100%; border-bottom: 4px solid var(--primary-red); }
        .content-panel { flex: 1; overflow-y: auto; padding: 20px; background: #fff; }

        /* Navigation Tabs in Sidebar */
        .nav-pills-custom .nav-link { color: #a0aec0; font-weight: 500; padding: 12px 15px; border-radius: 10px; margin-bottom: 5px; text-align: left; }
        .nav-pills-custom .nav-link.active { background: var(--primary-red); color: white; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4); }
        .nav-pills-custom .nav-link:hover:not(.active) { background: #2d2f39; color: white; }

        /* Cards & UI */
        .admin-card { background: #252831; border: none; border-radius: 12px; margin-bottom: 15px; color: white; padding: 15px; }
        .courier-status { padding: 10px; border-radius: 8px; background: #2d2f39; margin-bottom: 8px; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; }
        .courier-status:hover { background: #3a3d4a; border-left-color: var(--wellen-yellow); }
        .courier-status.active { background: #3a3d4a; border-left-color: var(--wellen-yellow); }

        /* Search Auto-Suggest */
        .search-container { position: relative; }
        #search-res-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: white; color: black; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 250px; overflow-y: auto; z-index: 2000; display: none; }
        .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.85rem; }
        .search-item:hover { background: #f8f9fa; }

        /* Chat Window Global */
        #chat-window { position: fixed; bottom: 20px; left: 370px; width: 320px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: none; flex-direction: column; z-index: 1000; overflow: hidden; border: 1px solid #ddd; }
        .chat-header { background: var(--sidebar-bg); color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #fdfdfd; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; position: relative; }
        .msg.admin { align-self: flex-end; background: var(--primary-red); color: white; margin-left: auto; }
        .msg.courier { align-self: flex-start; background: #e2e8f0; color: #2d3748; }

        /* Toast */
        .toast-container { z-index: 3000; }

        .dest-pill { background: #f8f9fa; border-radius: 8px; padding: 10px; margin-top: 10px; border-left: 4px solid #cbd5e0; color: #2d3748; }
        .dest-pill.done { border-left-color: #48bb78; background: #f0fff4; }
        .proof-img { width: 100%; border-radius: 8px; margin-top: 10px; cursor: pointer; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <!-- SIDEBAR PANEL -->
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="wellen_logo.jpg" style="height:50px;" class="mb-2">
            <div class="text-dark fw-bold small">LOGISTICS COMMAND CENTER</div>
        </div>

        <div class="sidebar-menu">
            <div class="nav flex-column nav-pills nav-pills-custom" id="v-pills-tab" role="tablist">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-dispatch"><i class="bi bi-send-plus me-2"></i> Buat Tugas</button>
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-monitor"><i class="bi bi-eye me-2"></i> Monitoring</button>
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-history"><i class="bi bi-clock-history me-2"></i> Laporan</button>
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-settings"><i class="bi bi-gear me-2"></i> Pengaturan</button>
            </div>

            <hr class="my-4" style="opacity: 0.1;">

            <div class="small fw-bold text-uppercase text-muted mb-3">Kurir Online</div>
            <div id="courier-list">
                <!-- Real-time couriers here -->
            </div>
        </div>

        <div class="p-3 border-top border-secondary text-center small text-muted">
            Wellen Print &copy; 2026
        </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div class="main-workspace">
        <div id="map"></div>

        <div class="content-panel">
            <div class="tab-content" id="v-pills-tabContent">
                <!-- TAB DISPATCH -->
                <div class="tab-pane fade show active" id="tab-dispatch">
                    <div class="row">
                        <div class="col-md-6">
                            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-danger"></i> Form Pengiriman</h5>
                            <div class="card border-0 shadow-sm p-4">
                                <label class="small fw-bold mb-1">1. Pilih Kurir Pelaksana</label>
                                <select id="sel-courier" class="form-select mb-3 shadow-none"></select>

                                <label class="small fw-bold mb-1">2. Tambah Lokasi (Cari atau Klik Peta)</label>
                                <div class="search-container mb-3">
                                    <input type="text" id="loc-search" class="form-control shadow-none" placeholder="Ketik nama PT / Alamat..." oninput="autoSuggest(this.value)">
                                    <div id="search-res-dropdown"></div>
                                </div>
                                <button class="btn btn-danger w-100 fw-bold py-2 shadow" onclick="submitTrip()">KIRIM TUGAS SEKARANG</button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h5 class="fw-bold mb-3">Rute Antrian</h5>
                            <div id="dispatch-queue" class="p-2"></div>
                        </div>
                    </div>
                </div>

                <!-- TAB MONITOR -->
                <div class="tab-pane fade" id="tab-monitor">
                    <h5 class="fw-bold mb-3">Status Pengiriman Berjalan</h5>
                    <div id="monitor-list" class="row g-3"></div>
                </div>

                <!-- TAB HISTORY -->
                <div class="tab-pane fade" id="tab-history">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0">Riwayat & Laporan</h5>
                        <input type="date" id="rep-date" class="form-control shadow-none" style="max-width: 200px;" onchange="loadHistory()">
                    </div>
                    <div id="history-list"></div>
                </div>

                <!-- TAB SETTINGS -->
                <div class="tab-pane fade" id="tab-settings">
                    <h5 class="fw-bold mb-4">Konfigurasi Sistem</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm p-4 mb-4">
                                <h6 class="fw-bold mb-3">Interval Tracking</h6>
                                <div class="input-group mb-3">
                                    <input type="number" id="cfg-interval" class="form-control" value="10">
                                    <select id="cfg-time-unit" class="form-select">
                                        <option value="1000">Detik</option>
                                        <option value="60000">Menit</option>
                                    </select>
                                </div>
                                <label class="small fw-bold mb-1">Interval Radius (Meter)</label>
                                <input type="number" id="cfg-distance" class="form-control mb-3" value="10">
                                <button class="btn btn-dark w-100 fw-bold" onclick="updateConfig()">Sinkronkan Aturan</button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm p-4">
                                <h6 class="fw-bold mb-3">Penyimpanan Cloudinary</h6>
                                <div id="cld-inputs">
                                    <input type="text" id="cld-name" class="form-control mb-2" placeholder="Cloud Name">
                                    <input type="text" id="cld-preset" class="form-control mb-3" placeholder="Upload Preset">
                                    <button class="btn btn-primary btn-sm w-100" onclick="saveCloudinary()">Simpan & Hubungkan</button>
                                </div>
                                <div id="cld-locked" class="text-center d-none">
                                    <div class="alert alert-success py-2 small"><i class="bi bi-cloud-check-fill"></i> Cloudinary Terhubung</div>
                                    <button class="btn btn-link btn-sm" onclick="unlockCloudinary()">Ganti Akun</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT POPUP -->
    <div id="chat-window">
        <div class="chat-header">
            <span id="chat-user-name" class="fw-bold small">Chat</span>
            <button class="btn-close btn-close-white" onclick="closeChat()"></button>
        </div>
        <div id="chat-msgs" class="chat-messages d-flex flex-column"></div>
        <div class="p-2 border-top bg-light d-flex">
            <input type="text" id="chat-input" class="form-control form-control-sm me-2 shadow-none" placeholder="Tulis instruksi..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="btn btn-sm btn-primary px-3" onclick="sendChat()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>

    <!-- IMAGE POPUP -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 bg-transparent">
                <div class="modal-body p-0 text-center">
                    <img id="modalImg" src="" style="max-width: 100%; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                    <button type="button" class="btn btn-light rounded-circle position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"><i class="bi bi-x"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert">
            <div class="d-flex p-2">
                <div class="toast-body fs-6"><i class="bi bi-check-circle-fill me-2"></i> Perintah Berhasil Terkirim!</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDoviDNLl_aSjM1NMN-g_gHpeIPPzC6Rk",
            authDomain: "ontrack-fccb8.firebaseapp.com",
            databaseURL: "https://ontrack-fccb8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ontrack-fccb8",
            storageBucket: "ontrack-fccb8.firebasestorage.app",
            messagingSenderId: "180144218738",
            appId: "1:180144218738:android:b0b991a7575ae7693ed8eb"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const db = firebase.firestore();

        const map = L.map('map').setView([-6.2, 106.81], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const markers = {};
        const registeredUsers = {};
        let tripQueue = [];
        let chatUnsub = null;
        let currentChatId = null;

        // Sync Users
        db.collection('users').onSnapshot(snap => {
            const sel = document.getElementById('sel-courier');
            sel.innerHTML = '<option value="">-- Pilih Kurir --</option>';
            snap.forEach(doc => {
                const u = doc.data();
                registeredUsers[doc.id] = u.name || doc.id.substring(0,8);
                if (u.role === 'courier') {
                    sel.innerHTML += `<option value="${doc.id}">${registeredUsers[doc.id]}</option>`;
                }
            });
        });

        // Real-time Locations
        rtdb.ref('courier_live_location').on('value', snap => {
            const data = snap.val() || {};
            const list = document.getElementById('courier-list');
            list.innerHTML = '';
            for (const id in data) {
                const c = data[id];
                const name = registeredUsers[id] || id.substring(0,8);
                if (markers[id]) markers[id].setLatLng([c.lat, c.lng]);
                else markers[id] = L.marker([c.lat, c.lng]).addTo(map).bindPopup(`<b>${name}</b>`);

                list.innerHTML += `
                    <div class="courier-status" onclick="map.flyTo([${c.lat}, ${c.lng}], 16)">
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold small">${name}</span>
                            <button class="btn btn-xs p-0 text-primary" onclick="openChat('${id}', '${name}')"><i class="bi bi-chat-text"></i></button>
                        </div>
                        <div class="extra-small text-muted mt-1" style="font-size:0.7rem">
                            Bat: ${c.batteryLevel}% | ${c.totalDistanceKm.toFixed(2)} KM
                        </div>
                    </div>`;
            }
        });

        // Monitoring
        db.collection('trips').where('status', '!=', 'completed').onSnapshot(snap => {
            const el = document.getElementById('monitor-list');
            el.innerHTML = '';
            snap.forEach(doc => {
                const t = doc.data();
                const name = registeredUsers[t.courierId] || "Kurir";
                el.innerHTML += `
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm p-3 h-100">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="fw-bold small text-primary">Trip: ${name}</span>
                                <span class="badge bg-warning text-dark extra-small">${t.status}</span>
                            </div>
                            ${t.destinations.map(d => `<div class="dest-pill ${d.status}"><b>${d.locationName}</b></div>`).join('')}
                            <button class="btn btn-sm btn-outline-dark w-100 mt-3" onclick="openChat('${doc.id}', 'Tugas ${name}')">Chat Admin</button>
                        </div>
                    </div>`;
            });
        });

        // Search & Nitikin
        map.on('click', async e => {
            const name = prompt("Nama Titik Antar:");
            if (!name) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`);
            const data = await res.json();
            tripQueue.push({ name, address: data.display_name, lat: e.latlng.lat, lng: e.latlng.lng });
            renderQueue();
        });

        async function autoSuggest(val) {
            const el = document.getElementById('search-res-dropdown');
            if (val.length < 3) { el.style.display = 'none'; return; }
            const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${val}&countrycodes=id&limit=5`);
            const data = await resp.json();
            el.innerHTML = ''; el.style.display = 'block';
            data.forEach(i => {
                const d = document.createElement('div');
                d.className = 'search-item';
                d.innerHTML = `<b>${i.name || i.display_name.split(',')[0]}</b><br><small>${i.display_name}</small>`;
                d.onclick = () => {
                    tripQueue.push({ name: i.name || "Tujuan", address: i.display_name, lat: parseFloat(i.lat), lng: parseFloat(i.lon) });
                    renderQueue(); el.style.display = 'none'; document.getElementById('loc-search').value = '';
                };
                el.appendChild(d);
            });
        }

        function renderQueue() {
            document.getElementById('dispatch-queue').innerHTML = tripQueue.map((d,i) => `
                <div class="dest-pill d-flex justify-content-between align-items-center">
                    <span><b>${i+1}. ${d.name}</b><br><small class="text-muted">${d.address.substring(0,40)}...</small></span>
                    <i class="bi bi-x-circle text-danger cursor-pointer" onclick="tripQueue.splice(${i},1);renderQueue()"></i>
                </div>`).join('');
        }

        async function submitTrip() {
            const cid = document.getElementById('sel-courier').value;
            if(!cid || tripQueue.length === 0) return alert("Pilih Kurir & Rute!");
            const tripId = "TRIP_" + Date.now();
            await db.collection('trips').doc(tripId).set({
                tripId, courierId: cid, status: "assigned", date: firebase.firestore.Timestamp.now(),
                destinations: tripQueue.map((d,i) => ({ stopIndex: i+1, locationName: d.name, address: d.address, latitude: d.lat, longitude: d.lng, status: "pending", proofPhotoUrl: "" }))
            });
            alert("Tugas Dikirim!"); tripQueue = []; renderQueue();
        }

        function openChat(id, name) {
            currentChatId = id; document.getElementById('chat-user-name').innerText = name;
            document.getElementById('chat-window').style.display = 'flex';
            if(chatUnsub) chatUnsub();
            const col = id.startsWith('TRIP_') ? db.collection('trips').doc(id).collection('messages') : db.collection('chats').doc(id).collection('messages');
            chatUnsub = col.orderBy('timestamp','asc').onSnapshot(snap => {
                const el = document.getElementById('chat-msgs'); el.innerHTML = '';
                snap.forEach(d => {
                    const m = d.data();
                    el.innerHTML += `<div class="msg ${m.senderId==='admin'?'admin':'courier'}">${m.text}</div>`;
                });
                el.scrollTop = el.scrollHeight;
            });
        }
        function closeChat() { document.getElementById('chat-window').style.display = 'none'; }
        async function sendChat() {
            const txt = document.getElementById('chat-input').value;
            if(!txt || !currentChatId) return;
            const col = currentChatId.startsWith('TRIP_') ? db.collection('trips').doc(currentChatId).collection('messages') : db.collection('chats').doc(currentChatId).collection('messages');
            await col.add({ senderId: 'admin', text: txt, timestamp: firebase.firestore.Timestamp.now() });
            document.getElementById('chat-input').value = '';
        }

        async function updateConfig() {
            const val = document.getElementById('cfg-interval').value;
            const unit = document.getElementById('cfg-time-unit').value;
            const dist = document.getElementById('cfg-distance').value;
            await db.collection('config').doc('tracking').set({ intervalMs: val * unit, minDistance: parseFloat(dist) });
            const toast = new bootstrap.Toast(document.getElementById('liveToast')); toast.show();
        }

        async function saveCloudinary() {
            const name = document.getElementById('cld-name').value;
            const preset = document.getElementById('cld-preset').value;
            await db.collection('config').doc('cloudinary').set({ cloudName: name, uploadPreset: preset });
            lockCloudinaryUI(); alert("Tersimpan!");
        }
        function lockCloudinaryUI() { document.getElementById('cld-inputs').classList.add('d-none'); document.getElementById('cld-locked').classList.remove('d-none'); }
        function unlockCloudinary() { document.getElementById('cld-inputs').classList.remove('d-none'); document.getElementById('cld-locked').classList.add('d-none'); }

        async function loadHistory() {
            const date = document.getElementById('rep-date').value;
            const el = document.getElementById('history-list'); el.innerHTML = 'Memuat...';
            const start = new Date(date); start.setHours(0,0,0,0);
            const snap = await db.collection('trips').where('date','>=',firebase.firestore.Timestamp.fromDate(start)).get();
            el.innerHTML = '';
            snap.forEach(doc => {
                const t = doc.data();
                el.innerHTML += `
                    <div class="card border-0 shadow-sm p-3 mb-2">
                        <div class="d-flex justify-content-between">
                            <b>${registeredUsers[t.courierId] || "Kurir"}</b>
                            <button class="btn btn-sm btn-link" onclick="this.nextElementSibling.classList.toggle('d-none')">Detail</button>
                            <div class="d-none mt-2 w-100">${t.destinations.map(d => `
                                <div class="dest-pill ${d.status}">${d.locationName}<br>
                                ${d.proofPhotoUrl ? `<img src="${d.proofPhotoUrl}" class="proof-img" onclick="openImagePopup('${d.proofPhotoUrl}')">` : ''}</div>`).join('')}
                            </div>
                        </div>
                    </div>`;
            });
        }
        function openImagePopup(url) { document.getElementById('modalImg').src = url; new bootstrap.Modal(document.getElementById('imageModal')).show(); }

        // Initial Load
        db.collection('config').doc('cloudinary').get().then(d => { if(d.exists) { document.getElementById('cld-name').value = d.data().cloudName; document.getElementById('cld-preset').value = d.data().uploadPreset; lockCloudinaryUI(); }});
    </script>
</body>
</html>
