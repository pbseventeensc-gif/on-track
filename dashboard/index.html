<!DOCTYPE html>
<html lang="id">
<head>
    <title>Wellen Print - Logistics Command Center</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #d32f2f; --secondary-color: #2c3e50; }
        body { background-color: #f8f9fa; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .main-container { flex: 1; display: flex; overflow: hidden; }
        .sidebar-left { width: 300px; background: white; border-right: 1px solid #dee2e6; overflow-y: auto; }
        #map { flex: 1; }
        .sidebar-right { width: 380px; background: white; border-left: 1px solid #dee2e6; display: flex; flex-direction: column; }
        .tab-content { flex: 1; overflow-y: auto; padding: 15px; }
        .courier-card { border-bottom: 1px solid #f1f1f1; cursor: pointer; padding: 12px; }
        .courier-card:hover { background-color: #f8f9fa; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-online { background-color: #2ecc71; }
        .trip-progress-card { border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px; padding: 12px; }
        .destination-pill { font-size: 0.8rem; background: #f1f3f5; padding: 6px; border-radius: 8px; margin-top: 5px; }
        .destination-pill.done { background: #d4edda; }
        .proof-img { width: 100%; border-radius: 5px; margin-top: 5px; cursor: pointer; }
        #chat-overlay { position: fixed; bottom: 20px; right: 400px; width: 300px; height: 400px; background: white; border: 1px solid #ddd; z-index: 2000; display: none; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 10px; }
        .chat-msg { padding: 5px 10px; border-radius: 15px; margin: 2px; max-width: 80%; font-size: 0.85rem; }
        .msg-admin { align-self: flex-end; background: var(--primary-color); color: white; }
        .msg-courier { align-self: flex-start; background: #eee; }
        .rating-stars { color: #f1c40f; font-size: 1.2rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container-fluid">
            <img src="wellen_logo.jpg" style="height:40px" class="me-2">
            <span class="fw-bold">COMMAND CENTER</span>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar-left" id="courier-list"></div>
        <div id="map"></div>
        <div class="sidebar-right">
            <ul class="nav nav-tabs nav-fill" id="adminTabs">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-dispatch">DISPATCH</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-active">MONITOR</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-history">LAPORAN</button></li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-dispatch">
                    <h6>1. Pilih Kurir</h6>
                    <select id="sel-courier" class="form-select mb-3"></select>
                    <h6>2. Tambah Rute</h6>
                    <div class="input-group mb-2">
                        <input type="text" id="loc-search" class="form-control" placeholder="Cari PT / Alamat...">
                        <button class="btn btn-primary" onclick="searchLocation()"><i class="bi bi-search"></i></button>
                    </div>
                    <div id="search-res" class="list-group mb-2" style="max-height:150px; overflow-y:auto"></div>
                    <div id="queue" class="mb-3"></div>
                    <button class="btn btn-danger w-100" onclick="submitTrip()">KIRIM TUGAS</button>
                </div>
                <div class="tab-pane fade" id="tab-active">
                    <div id="monitor-list"></div>
                </div>
                <div class="tab-pane fade" id="tab-history">
                    <input type="date" id="rep-date" class="form-control mb-2" onchange="loadReport()">
                    <div id="report-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Popup -->
    <div id="chat-overlay">
        <div class="p-2 bg-dark text-white d-flex justify-content-between">
            <span id="chat-title">Chat</span>
            <button class="btn-close btn-close-white" onclick="closeChat()"></button>
        </div>
        <div id="chat-msgs" class="p-2 flex-grow-1 overflow-y-auto d-flex flex-column"></div>
        <div class="p-2 border-top d-flex">
            <input type="text" id="chat-input" class="form-control form-control-sm me-1" placeholder="Pesan...">
            <button class="btn btn-sm btn-primary" onclick="sendChat()"><i class="bi bi-send"></i></button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDoviDNLl_aSjM1NMN-g_gHpeIPPzC6Rk",
            authDomain: "ontrack-fccb8.firebaseapp.com",
            databaseURL: "https://ontrack-fccb8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ontrack-fccb8",
            storageBucket: "ontrack-fccb8.firebasestorage.app",
            messagingSenderId: "180144218738",
            appId: "1:180144218738:android:b0b991a7575ae7693ed8eb"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const db = firebase.firestore();

        const map = L.map('map').setView([-6.2, 106.81], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let activeTripId = null;
        let chatUnsubscribe = null;
        const markers = {};
        let tripQueue = [];

        // --- CORE LOGIC ---
        // 1. Listen to All Registered Couriers (Firestore)
        db.collection('users').where('role', '==', 'courier').onSnapshot(snap => {
            const sel = document.getElementById('sel-courier');
            const currentSelected = sel.value;
            sel.innerHTML = '<option value="">-- Pilih Kurir --</option>';

            snap.forEach(doc => {
                const u = doc.data();
                const opt = document.createElement('option');
                opt.value = doc.id;
                opt.innerText = u.name || doc.id.substring(0,8);
                if (doc.id === currentSelected) opt.selected = true;
                sel.appendChild(opt);
            });
        });

        // 2. Listen to Live Locations (RTDB)
        rtdb.ref('courier_live_location').on('value', snap => {
            const data = snap.val() || {};
            const list = document.getElementById('courier-list');
            list.innerHTML = '<div class="p-2 border-bottom fw-bold bg-light">KURIR ONLINE</div>';

            for (const id in data) {
                const c = data[id];
                if (markers[id]) markers[id].setLatLng([c.lat, c.lng]);
                else markers[id] = L.marker([c.lat, c.lng]).addTo(map).bindPopup(`Kurir: ${id.substring(0,5)}`);

                list.innerHTML += `<div class="courier-card" onclick="map.flyTo([${c.lat}, ${c.lng}], 16)">
                    <span class="status-dot bg-online"></span><b>${id.substring(0,8)}</b><br>
                    <small>${c.batteryLevel}% Bat | ${c.totalDistanceKm.toFixed(2)} km</small>
                </div>`;
            }
        });

        db.collection('trips').where('status', '!=', 'completed').onSnapshot(snap => {
            const container = document.getElementById('monitor-list');
            container.innerHTML = '';
            snap.forEach(doc => {
                const t = doc.data();
                const card = document.createElement('div');
                card.className = 'trip-progress-card bg-white shadow-sm';
                card.innerHTML = `
                    <div class="d-flex justify-content-between"><b>Trip: ${doc.id.substring(0,8)}</b> <span class="badge bg-warning text-dark">${t.status}</span></div>
                    <small>Kurir: ${t.courierId.substring(0,8)}</small>
                    <div class="mt-2">${t.destinations.map(d => `
                        <div class="destination-pill ${d.status}">
                            <i class="bi bi-geo-alt"></i> ${d.locationName}
                            ${d.proofPhotoUrl ? `<br><a href="${d.proofPhotoUrl}" target="_blank"><img src="${d.proofPhotoUrl}" class="proof-img"></a>` : ''}
                        </div>
                    `).join('')}</div>
                    <button class="btn btn-sm btn-outline-primary mt-2 w-100" onclick="openChat('${doc.id}')"><i class="bi bi-chat-dots"></i> Buka Chat</button>
                `;
                container.appendChild(card);
            });
        });

        // --- RATING LOGIC (PROFESSIONAL) ---
        function calculateRating(trip) {
            const total = trip.destinations.length;
            const completed = trip.destinations.filter(d => d.status === 'done').length;
            const score = (completed / total) * 5;
            let stars = '';
            for(let i=0; i<5; i++) stars += (i < Math.floor(score)) ? '★' : '☆';
            return `<span class="rating-stars">${stars}</span> (${score.toFixed(1)})`;
        }

        async function loadReport() {
            const date = document.getElementById('rep-date').value;
            const container = document.getElementById('report-list');
            container.innerHTML = 'Memuat...';
            const start = new Date(date); start.setHours(0,0,0,0);
            const end = new Date(date); end.setHours(23,59,59,999);

            const snap = await db.collection('trips')
                .where('date', '>=', firebase.firestore.Timestamp.fromDate(start))
                .where('date', '<=', firebase.firestore.Timestamp.fromDate(end)).get();

            container.innerHTML = '';
            snap.forEach(doc => {
                const t = doc.data();
                container.innerHTML += `<div class="card p-2 mb-2 border-0 shadow-sm">
                    <b>Kurir: ${t.courierId.substring(0,8)}</b><br>
                    Rating Kerja: ${calculateRating(t)}<br>
                    Jarak: ${t.totalDistanceKm ? t.totalDistanceKm.toFixed(2) : '-'} km<br>
                    <small>Tujuan: ${t.destinations.length} titik</small>
                </div>`;
            });
        }

        // --- CHAT LOGIC ---
        function openChat(tripId) {
            activeTripId = tripId;
            document.getElementById('chat-overlay').style.display = 'flex';
            document.getElementById('chat-title').innerText = "Chat Trip: " + tripId.substring(0,8);
            if (chatUnsubscribe) chatUnsubscribe();
            chatUnsubscribe = db.collection('trips').document(tripId).collection('messages')
                .orderBy('timestamp', 'asc').onSnapshot(snap => {
                    const msgContainer = document.getElementById('chat-msgs');
                    msgContainer.innerHTML = '';
                    snap.forEach(mDoc => {
                        const m = mDoc.data();
                        const isAdm = m.senderId === 'admin';
                        msgContainer.innerHTML += `<div class="chat-msg ${isAdm ? 'msg-admin' : 'msg-courier'}">${m.text}</div>`;
                    });
                    msgContainer.scrollTop = msgContainer.scrollHeight;
                });
        }

        function closeChat() { document.getElementById('chat-overlay').style.display = 'none'; if(chatUnsubscribe) chatUnsubscribe(); }

        async function sendChat() {
            const txt = document.getElementById('chat-input').value;
            if (!txt || !activeTripId) return;
            await db.collection('trips').document(activeTripId).collection('messages').add({
                senderId: 'admin', text: txt, timestamp: firebase.firestore.Timestamp.now()
            });
            document.getElementById('chat-input').value = '';
        }

        // --- SEARCH & DISPATCH ---
        async function searchLocation() {
            const q = document.getElementById('loc-search').value;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=id&limit=5`);
            const data = await res.json();
            const el = document.getElementById('search-res');
            el.innerHTML = '';
            data.forEach(i => {
                const btn = document.createElement('button');
                btn.className = 'list-group-item list-group-item-action small';
                btn.innerText = i.display_name;
                btn.onclick = () => {
                    tripQueue.push({ name: i.display_name.split(',')[0], lat: parseFloat(i.lat), lng: parseFloat(i.lon) });
                    renderQueue(); el.innerHTML = ''; document.getElementById('loc-search').value = '';
                };
                el.appendChild(btn);
            });
        }

        function renderQueue() {
            const q = document.getElementById('queue');
            q.innerHTML = tripQueue.map((d, i) => `<div class="small bg-light p-1 mt-1 border rounded d-flex justify-content-between">${i+1}. ${d.name} <i class="bi bi-x text-danger" onclick="tripQueue.splice(${i},1);renderQueue()"></i></div>`).join('');
        }

        async function submitTrip() {
            const cid = document.getElementById('sel-courier').value;
            if (!cid || tripQueue.length === 0) return alert("Pilih kurir & rute!");
            const tripId = "TRIP_" + Date.now();
            await db.collection('trips').doc(tripId).set({
                tripId, courierId: cid, status: "assigned", date: firebase.firestore.Timestamp.now(),
                destinations: tripQueue.map((d, i) => ({ stopIndex: i+1, locationName: d.name, latitude: d.lat, longitude: d.lng, status: "pending", proofPhotoUrl: "" }))
            });
            alert("Tugas Terkirim!"); tripQueue = []; renderQueue();
        }
    </script>
</body>
</html>
