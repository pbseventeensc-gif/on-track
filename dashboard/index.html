<!DOCTYPE html>
<html>
<head>
    <title>Dashboard KurirKita</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
        .info-box {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="info-box">
        <b>Dashboard KurirKita</b><br>
        <span id="status">Menghubungkan ke Firebase...</span>
    </div>
    <div id="map"></div>

    <script>
        // Konfigurasi Firebase Anda (dari google-services.json)
        const firebaseConfig = {
            apiKey: "AIzaSyBDoviDNLl_aSjM1NMN-g_gHpeIPPzC6Rk",
            authDomain: "ontrack-fccb8.firebaseapp.com",
            databaseURL: "https://ontrack-fccb8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ontrack-fccb8",
            storageBucket: "ontrack-fccb8.firebasestorage.app",
            messagingSenderId: "180144218738",
            appId: "1:180144218738:android:b0b991a7575ae7693ed8eb"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Inisialisasi Peta (OpenStreetMap)
        const map = L.map('map').setView([-6.200000, 106.816666], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};

        // Listen data lokasi kurir
        database.ref('courier_locations').on('value', (snapshot) => {
            document.getElementById('status').innerText = "Update Real-time Aktif";
            const data = snapshot.val();

            for (const id in data) {
                const courier = data[id];
                const pos = [courier.latitude, courier.longitude];

                if (markers[id]) {
                    markers[id].setLatLng(pos);
                } else {
                    markers[id] = L.marker(pos).addTo(map)
                        .bindPopup("Kurir: " + courier.courierId);
                }
            }
        });
    </script>
</body>
</html>
